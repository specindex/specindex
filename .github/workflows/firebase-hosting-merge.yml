# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  # Dispatchable so deploy-reconcile.yml can correct a site that drifted
  # behind main -- bot merges fire no push event, so without this the
  # reconciler can DETECT a stale site but not fix one.
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  # Each build is a full 27K+-page static export -- back-to-back pushes
  # otherwise queue redundant full builds instead of the newest commit
  # (which already contains everything the older ones do) superseding them.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm ci && npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          SPECINDEX_BUILD_TOKEN: ${{ secrets.SPECINDEX_BUILD_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPECINDEX_AI }}
          channelId: live
          projectId: specindex-ai
      # Added 2026-07-29 after this exact workflow failed silently for 2.5
      # days (2026-07-27 through 2026-07-29) with nobody noticing -- the
      # production site just sat on a stale build the whole time. This is
      # the cheapest possible fix for "someone finds out the same day, not
      # 2.5 days later": an email the moment build or deploy fails.
      - name: Notify on failure
        if: failure()
        run: python3 scripts/notify-workflow-failure.py
        env:
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          NOTIFY_TO: asif@specindex.ai
