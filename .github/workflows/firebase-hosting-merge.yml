# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  # Dispatchable so deploy-reconcile.yml can correct a site that drifted
  # behind main -- bot merges fire no push event, so without this the
  # reconciler can DETECT a stale site but not fix one.
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  # Back-to-back pushes otherwise queue redundant builds instead of the newest
  # commit (which already contains everything the older ones do) superseding
  # them. NOT a 27K-page export, despite what this comment used to say:
  # getFeaturedProjectIds() caps static generation at 200 project pages, and
  # has since a full build crashed at ~175K rows after four hours.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # DEPENDENCY CACHE. The whole workflow was one `npm ci && npm run build`
      # line with no setup-node, so every deploy reinstalled the entire tree
      # from scratch. Measured 2026-08-06: the combined step took 4m57s of a
      # 5m40s build -- 89% of the total -- while the actual Firebase deploy
      # took 37 seconds.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # NEXT.JS BUILD CACHE. Separate from node_modules and worth its own
      # entry: it holds compiled output and the fetch cache, so an unchanged
      # page does not re-render or re-fetch. Keyed on the lockfile plus source
      # so a dependency bump or a code change still invalidates it, with
      # restore-keys so a partial hit still beats a cold start.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-
            nextjs-

      - run: npm ci && npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          SPECINDEX_BUILD_TOKEN: ${{ secrets.SPECINDEX_BUILD_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPECINDEX_AI }}
          channelId: live
          projectId: specindex-ai
      # Added 2026-07-29 after this exact workflow failed silently for 2.5
      # days (2026-07-27 through 2026-07-29) with nobody noticing -- the
      # production site just sat on a stale build the whole time. This is
      # the cheapest possible fix for "someone finds out the same day, not
      # 2.5 days later": an email the moment build or deploy fails.
      - name: Notify on failure
        if: failure()
        run: python3 scripts/notify-workflow-failure.py
        env:
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          NOTIFY_TO: asif@specindex.ai
