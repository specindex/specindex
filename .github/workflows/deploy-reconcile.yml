# Is what's deployed the same as main? If not, deploy.
#
# WHY THIS HAS TO EXIST. api-deploy.yml runs on pushes to main that touch
# api/**, which is correct and is not sufficient, because a merge can land on
# main WITHOUT producing a push event that GitHub will act on:
#
#   GitHub does not trigger workflows for pushes made using GITHUB_TOKEN.
#
# pr-flow.yml enables auto-merge with GITHUB_TOKEN, so PRs it merges are
# attributed to github-actions[bot] and fire NOTHING. Observed on 2026-08-05:
# PR #129 merged to main and produced zero workflow runs for its SHA -- no API
# deploy, no site deploy. The fix that PR carried sat in main, undeployed, and
# the only symptom was the original bug still happening. That is the same shape
# as the outage that started this whole thread, arriving by a different route.
#
# A TRIGGER IS A HOPE; A RECONCILER IS A GUARANTEE. Rather than enumerate every
# way an event can be swallowed -- bot tokens, path filters, skipped runs,
# cancelled concurrency -- this compares the world to the intent and corrects
# the difference. Every image is tagged with the commit that built it
# (api-deploy.yml), so "what is running" is directly readable and the comparison
# is a fact rather than an inference.
#
# THE ALTERNATIVE, if you would rather fix the cause: give pr-flow.yml a
# personal access token instead of GITHUB_TOKEN, so its merges are attributed
# to a user and trigger normally. That needs a new secret and a token to
# rotate. This needs neither, and it also catches the failures a PAT would not.

name: Deploy reconcile

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: deploy-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # FULL history, not the default shallow depth-1 clone. The
          # "Merged PRs whose commits never reached main" step below runs
          # `git merge-base --is-ancestor`, which needs real history to
          # answer at all -- in a shallow clone it exits non-zero because
          # the objects are absent, not because the commit is missing from
          # main, and its `2>/dev/null` hides the "not a valid object name"
          # that would have said so. Result, measured 2026-08-08: all 14
          # recently-merged PRs (#146-#159) flagged as missing on every run,
          # every one a false positive (verified locally -- their heads ARE
          # ancestors of main). The check failed daily and said nothing true.
          fetch-depth: 0

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: specindex-ai

      - name: Compare deployed image to main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA=$(git rev-parse HEAD)

          # The running image is tagged with the commit that built it.
          IMAGE=$(gcloud run services describe specindex-api --region us-central1 \
                    --format='value(spec.template.spec.containers[0].image)')
          echo "main:     $MAIN_SHA"
          echo "deployed: $IMAGE"

          # Deploys are BY DIGEST, so the tag is not in the running image
          # reference. Ask Artifact Registry which tags point at that digest.
          DIGEST="${IMAGE##*@}"
          TAGS=$(gcloud artifacts docker tags list \
                   us-central1-docker.pkg.dev/specindex-ai/cloud-run-source-deploy/specindex-api \
                   --format='value(tag,version)' 2>/dev/null \
                 | grep "$DIGEST" | awk '{print $1}' | tr '\n' ' ')
          echo "tags on the running digest: ${TAGS:-none}"

          if echo "$TAGS" | grep -q "$MAIN_SHA"; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
            echo "deployed API matches main"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
            echo "::warning::deployed API does NOT match main ($MAIN_SHA) -- redeploying"
          fi

      - name: Deploy the API to match main
        if: steps.check.outputs.in_sync != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run api-deploy.yml --ref main
          echo "### Deploy reconcile: triggered an API deploy" >> $GITHUB_STEP_SUMMARY
          echo "main was ahead of the deployed revision." >> $GITHUB_STEP_SUMMARY

      # THE FRONTEND HALF. The first version of this workflow reconciled only
      # the API, which left the same hole for the site: bot merges swallow the
      # Firebase deploy exactly as they swallow the API deploy, and the site is
      # where a broken signup form is actually visible to a stranger.
      #
      # Hosting has no image tag to read, so the question is answered from
      # GitHub instead: what commit did the last SUCCESSFUL site deploy build?
      # If that is not main's HEAD, the site is stale.
      - name: Compare deployed site to main
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA=$(git rev-parse HEAD)
          LAST=$(gh run list --workflow=firebase-hosting-merge.yml --branch main \
                   --status success --limit 1 --json headSha -q '.[0].headSha')
          echo "main:            $MAIN_SHA"
          echo "last site build: ${LAST:-none}"
          if [ "$LAST" = "$MAIN_SHA" ]; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
            echo "deployed site matches main"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
            echo "::warning::deployed site does NOT match main -- redeploying"
          fi

      - name: Deploy the site to match main
        if: steps.site.outputs.in_sync != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run firebase-hosting-merge.yml --ref main \
            && echo "triggered a site deploy" \
            || echo "::error::could not dispatch the site deploy (needs workflow_dispatch on firebase-hosting-merge.yml)"

      # MERGED IS NOT LANDED. On 2026-08-05 commit 224ba7a was pushed to a
      # branch whose PR had ALREADY merged. The branch carried it, the merge
      # did not, and nothing reported the difference -- the work was announced
      # as shipped and was not on main. Found a day later by reading a file.
      #
      # GitHub's own UI is no help here: the PR shows merged, the branch shows
      # the commit, and only comparing the two reveals the gap. So compare
      # them on a schedule.
      - name: Merged PRs whose commits never reached main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin main
          missing=0
          # Recently merged PRs only -- old ones have long since been
          # superseded and would generate noise forever.
          for pr in $(gh pr list --state merged --limit 15 --json number,mergedAt,title -q '.[].number'); do
            head=$(gh pr view "$pr" --json headRefOid -q .headRefOid)
            [ -z "$head" ] && continue
            # Fetch the PR's own ref before testing. `fetch-depth: 0` gets full
            # history of every BRANCH, but these branches are deleted on merge
            # (branch-hygiene.yml sweeps them), so the head commit is not
            # reachable from any branch ref -- it survives only under
            # refs/pull/N/head. Without this the objects are simply absent and
            # the check cannot answer at all, which is what it spent weeks
            # doing while reporting the absence as a missing-commit finding.
            git fetch --quiet origin "refs/pull/$pr/head" 2>/dev/null || true
            # A merged PR's head must be an ancestor of main. If it is not,
            # something was pushed to that branch after the merge.
            #
            # Do NOT redirect stderr away here. It used to be `2>/dev/null`,
            # which swallowed git's own "not a valid object name" and made a
            # shallow-clone misconfiguration (fetch-depth, fixed above) look
            # identical to a real missing-commit finding for weeks of daily
            # failures. An error this check cannot explain is worse than no
            # check: distinguish "answered no" from "could not answer".
            if ! git cat-file -e "$head^{commit}" 2>&1; then
              echo "::error::PR #$pr head $head is not present in this clone -- cannot evaluate (clone/fetch problem, NOT a missing-commit finding)"
              missing=$((missing+1))
              continue
            fi
            # TEST THE MERGE COMMIT, NOT ONLY THE HEAD. Under a SQUASH merge
            # the head is never an ancestor of main -- GitHub writes a new
            # commit and the branch's own tip stays off main permanently, by
            # design. A head-only test therefore reports every squash-merged
            # PR as missing forever. (docs/INGESTION_REFERENCE.md recorded
            # Gemini's "squash-merge defeats a merge-base test" as disproven;
            # for squash specifically it was correct.) mergeCommit is what
            # actually landed, whichever strategy was used, so check that
            # first and fall back to the head for older rows that predate it.
            merge_oid=$(gh pr view "$pr" --json mergeCommit -q '.mergeCommit.oid // empty')
            if [ -n "$merge_oid" ]; then
              git fetch --quiet origin "$merge_oid" 2>/dev/null || true
              if git cat-file -e "${merge_oid}^{commit}" 2>/dev/null \
                 && git merge-base --is-ancestor "$merge_oid" origin/main; then
                continue
              fi
            fi
            if ! git merge-base --is-ancestor "$head" origin/main; then
              echo "::warning::PR #$pr merged, but neither its merge commit nor its head $head is on main -- work pushed after the merge"
              echo "- PR #$pr: not on main" >> $GITHUB_STEP_SUMMARY
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing merged PR(s) carry commits that never reached main"
            exit 1
          fi
          echo "all recently merged PRs are fully on main"

      - name: Report
        if: always()
        run: |
          echo "### Deploy reconcile: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- API in sync with main: ${{ steps.check.outputs.in_sync }}" >> $GITHUB_STEP_SUMMARY
          echo "- Site in sync with main: ${{ steps.site.outputs.in_sync }}" >> $GITHUB_STEP_SUMMARY
