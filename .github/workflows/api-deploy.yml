# Deploy the API to Cloud Run when api/ changes.
#
# WHY THIS EXISTS. The frontend auto-deploys on merge to main
# (firebase-hosting-merge.yml) and the API did not deploy at all -- it shipped
# by a manual `gcloud run deploy` documented in docs/CLOUD-RUN-DATABASE.md.
# A repo where the frontend deploys itself and its backend does not will keep
# producing the same class of failure: someone changes an API contract, the UI
# ships, the API does not, and the site breaks in a way that looks like a
# frontend bug.
#
# It nearly happened on 2026-08-05. The UI's new default filter sends
# `status=planning,permitting,bidding` while the deployed API compared status
# with an exact match, so the query matched zero rows. Merging the frontend
# alone would have deployed a landing page showing NO projects under a headline
# about projects worth chasing.
#
# ORDER MATTERS AND IS ENFORCED BY THE TRIGGER. This runs on pushes to main
# that touch api/**, and the API change is backwards-compatible by convention:
# a new API must keep serving the OLD frontend, because the two deploy
# independently and either can land first. Never ship an API change that
# requires a simultaneous frontend change.

name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: "Deploy without the post-deploy smoke test (not recommended)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  # Never let two API deploys overlap -- Cloud Run would serve a mix of
  # revisions while both are rolling.
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation, matching every other workflow in
          # this repo. The first version used credentials_json: GCP_SA_KEY,
          # a secret that does not exist here -- the deploy failed on its very
          # first run with "must specify exactly one of
          # workload_identity_provider or credentials_json". Copying an auth
          # pattern from documentation instead of from the repo's own
          # working workflows is what caused it.
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: specindex-ai

      # Catch syntax errors before a broken revision reaches Cloud Run. A
      # failed deploy leaves the previous revision serving, but a deploy that
      # SUCCEEDS with broken code does not.
      - name: Syntax check
        run: python3 -m compileall -q api/

      # Would this revision serve every route the frontend calls? The frontend
      # deploys on every merge and the API only when api/** changes, so the
      # live site is routinely running against an older API. Catching a removed
      # or renamed route HERE means the deploy fails instead of the browser.
      - name: API contract (static)
        run: python3 scripts/check-api-contract.py

      # NO --set-env-vars. It REPLACES the entire environment, and this
      # service carries nine variables -- DATABASE_URL, CLERK_ISSUER,
      # MAPBOX_TOKEN, EMAIL_SMTP_*, CONTACT_NOTIFY_TO, SPECINDEX_BUILD_TOKEN,
      # FIREBASE_PROJECT_ID, ADMIN_EMAILS. Passing only DATABASE_URL would
      # silently delete the other eight and break sign-in, email and admin
      # access on the very deploy meant to fix a bug. Omitting env vars
      # entirely makes the deploy INHERIT the existing configuration, which is
      # what a code-only deploy should do. Use --update-env-vars (merges, never
      # replaces) if a variable genuinely needs changing.
      # BUILD HERE, NOT IN CLOUD BUILD. This used to be `--source ./api`, which
      # looks simpler and is why it was written that way. It is not simpler: it
      # is a managed path whose permission set is undocumented and GROWING, and
      # you discover the set one 403 at a time. On 2026-08-05 the deploy failed
      # all day across three separate permissions, each revealed only after
      # granting the last:
      #
      #     run.services.get      -> granted role, retried
      #     storage.buckets.get   -> granted on the staging bucket, retried
      #     storage.buckets.list  -> PROJECT-level, cannot be bucket-scoped
      #
      # Granting the third would not have been the last one. --source stages a
      # tarball into a managed GCS bucket, invokes Cloud Build, and writes build
      # logs to another bucket -- three services and two buckets implicated in
      # shipping a container we already have a Dockerfile for.
      #
      # Building in the runner deletes that entire dependency. No Cloud Build,
      # no staging bucket, no storage permissions of any kind. The permission
      # set becomes fixed and knowable -- run.admin, iam.serviceAccountUser,
      # artifactregistry.writer -- all three of which the deploy SA already
      # held, so this change required no new IAM at all.
      #
      # DEPLOY BY DIGEST, NOT BY TAG. A tag can be moved; a digest cannot. The
      # digest is recorded in the step summary, so "what is actually running"
      # is answerable after the fact and a rollback is one deploy by an older
      # digest. Tagging by git SHA makes that history readable.
      - name: Build and push the image
        id: build
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          IMAGE=us-central1-docker.pkg.dev/specindex-ai/cloud-run-source-deploy/specindex-api
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" ./api
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${GITHUB_SHA}")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "built $DIGEST"

      - name: Deploy to Cloud Run (code only; env inherited)
        run: |
          gcloud run deploy specindex-api \
            --image '${{ steps.build.outputs.digest }}' \
            --region us-central1 \
            --allow-unauthenticated \
            --add-cloudsql-instances specindex-ai:us-central1:specindex-db \
            --quiet

      # THE SMOKE TEST IS THE POINT. A deploy that returns 200 on an empty
      # result set is indistinguishable from a healthy one, and that is exactly
      # the failure this workflow exists to prevent. So assert on CONTENT: the
      # UI's default filter must return rows, not merely a 200.
      - name: Smoke test the default filter
        if: ${{ !inputs.skip_smoke }}
        run: |
          URL=$(gcloud run services describe specindex-api --region us-central1 \
                  --format='value(status.url)')
          echo "deployed: $URL"

          # /v1/projects requires a Firebase session OR the build token. Without
          # it every check returns 401 and the smoke test fails every deploy --
          # which would train people to ignore it. Read the token off the
          # running service rather than duplicating it as a CI secret, so it
          # cannot drift from what the service actually accepts.
          TOK=$(gcloud run services describe specindex-api --region us-central1 \
                  --format="value(spec.template.spec.containers[0].env)" \
                | tr ';' '\n' | grep SPECINDEX_BUILD_TOKEN \
                | grep -o "'value': '[^']*'" | sed "s/'value': //;s/'//g")
          if [ -z "$TOK" ]; then
            echo "::error::SPECINDEX_BUILD_TOKEN not found on the service; cannot smoke test"
            exit 1
          fi

          fail=0
          check () {  # name, query, min_expected
            body=$(curl -s --max-time 60 -H "X-Build-Token: $TOK" \
                     "$URL/v1/projects?limit=1&$2" || echo '{}')
            total=$(python3 -c "import sys,json;print(json.loads(sys.stdin.read() or '{}').get('total',-1))" <<<"$body")
            if [ "$total" -lt "$3" ]; then
              echo "::error::$1 returned total=$total, expected >= $3  (query: $2)"
              fail=1
            else
              echo "ok: $1 total=$total"
            fi
          }

          # The UI's DEFAULT view. If this is empty the landing page is empty.
          check "spec-still-open default" "status=planning,permitting,bidding" 1000
          # Single status must keep working -- the old frontend may still be live.
          check "single status (back-compat)" "status=permitting" 1000
          # Multi-state, the other comma-separated filter.
          check "multi-state" "state=NY,NJ" 100

          exit $fail

      # The content smoke test above asserts /v1/projects returns ROWS. It is a
      # good check and it was blind to the signup outage: a MISSING route is not
      # an empty result set on a route it tests, it is a route it never
      # mentions. This probes the deployed revision for every path the frontend
      # actually calls and fails on a 404.
      - name: API contract (live)
        if: ${{ !inputs.skip_smoke }}
        run: |
          URL=$(gcloud run services describe specindex-api --region us-central1 \
                  --format='value(status.url)')
          python3 scripts/check-api-contract.py --live "$URL"

      - name: Report
        if: always()
        run: |
          echo "### API deploy: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Revision: $(gcloud run services describe specindex-api \
            --region us-central1 --format='value(status.latestReadyRevisionName)' 2>/dev/null || echo unknown)" \
            >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

      # A step summary is not a notification. This deploy failed three times in
      # a row on 2026-08-05 and the only record was a summary nobody opened,
      # so signup stayed broken in production for a full day. An open issue is
      # visible without anyone thinking to look.
      - name: Raise an issue if the deploy failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "API deploy failed on $(git rev-parse --short HEAD)" \
            --body "The API deploy failed, so **the deployed API is older than \`main\`**.

          Any frontend merged since then is live against the previous revision.
          If that frontend calls a route this deploy would have added, users see
          a generic error that no retry can fix.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "deploy-failure" 2>/dev/null || \
          echo "::error::API deploy failed AND the issue could not be created"
