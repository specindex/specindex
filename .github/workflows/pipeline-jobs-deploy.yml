# Build the pipeline image and deploy the Cloud Run Jobs that run the coverage
# pipeline. Section 3 of coverage/docs/coverage-plan-v2.md: heavy crawling
# belongs in Cloud Run Jobs, not on a laptop and not in a 6-hour Actions runner.
#
# COPIES THE PROVEN PATTERN from api-deploy.yml -- WIF auth, docker build in CI,
# deploy BY DIGEST. An earlier deploy in this repo broke on its first run because
# an auth pattern was copied from documentation instead of from the workflows
# that already work here.

name: pipeline-jobs-deploy

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/pipeline-jobs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pipeline-jobs-deploy
  cancel-in-progress: false

env:
  REGION: us-central1
  PROJECT: specindex-ai
  IMAGE: us-central1-docker.pkg.dev/specindex-ai/cloud-run-source-deploy/specindex-pipeline
  INSTANCE: specindex-ai:us-central1:specindex-db

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: build
        name: Build and push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f pipeline/Dockerfile \
            -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          # Deploy by DIGEST, not tag: a tag can move between the push and the
          # deploy and you get a different image than you tested.
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE:${GITHUB_SHA}" \
                    --format='value(image_summary.fully_qualified_digest)')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "deploying $DIGEST"

      - name: Deploy jobs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # One image, several jobs; the args are what differ. A new job is a
          # flag here rather than a new container.
          deploy_job () {
            local name="$1"; shift
            local timeout="$1"; shift
            # --args TAKES ONE COMMA-SEPARATED VALUE, not a list of words.
            #
            # This was `--args "$@"`, which expands each argument as its own
            # shell word, so gcloud parsed the SCRIPT's flags as its own:
            #   ERROR: unrecognized arguments: --tier (did you mean '--container'?)
            # Every run of this workflow since it was written failed that way,
            # and because the failure was in a deploy rather than in a pull,
            # nothing downstream reported a gap -- there were simply no jobs.
            local args; args=$(IFS=,; echo "$*")
            gcloud run jobs deploy "$name" \
              --image "$DIGEST" \
              --region "$REGION" --project "$PROJECT" \
              --set-cloudsql-instances "$INSTANCE" \
              --set-secrets "DATABASE_URL=DATABASE_URL:latest,SAM_API_KEY=SAM_API_KEY:latest,LEGISTAR_TOKEN_NYC=LEGISTAR_TOKEN_NYC:latest" \
              # GOOGLE_CLOUD_LOCATION IS THE VERTEX AI ENDPOINT, NOT THE CLOUD
              # RUN REGION. It was pinned to $REGION (us-central1), where
              # gemini-3.6-flash does not exist -- live-verified 2026-08-08,
              # every call returns 404 NOT_FOUND "was not found or your project
              # does not have access to it", while the identical call against
              # "global" succeeds. Newer Gemini models publish to the global
              # endpoint only. This env var also OVERRODE the correct "global"
              # default in state_agent_pipeline/config.py and in
              # classify-spec-documents.py, so it silently broke Gemini for
              # every job here, not just classification. Cloud SQL still
              # attaches by region via --set-cloudsql-instances; these are
              # unrelated settings that happened to share a value.
              --set-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT,GOOGLE_CLOUD_LOCATION=global" \
              --task-timeout "$timeout" --max-retries 2 --memory 4Gi --cpu 2 \
              --args "$args" \
              --quiet
          }
          # Long timeouts because these are the jobs that kept dying on a laptop.
          # Capture AND load in one execution. A Cloud Run Job's filesystem is
          # ephemeral, so a capture that writes its pull log and exits leaves the
          # loader nothing to read -- the documents would sit in GCS with nothing
          # pointing at them, and the run would look like a success.
          #
          # 6h -> 2h on pull-portals, 2026-08-08. With --max-retries 2 a 6h
          # timeout means an execution can burn EIGHTEEN hours before it
          # reports failure, against a cron that fires every 24h -- so a hang
          # never surfaces as a failure before the next one starts, and they
          # stack. Measured that day: TWO executions simultaneously stuck in
          # RUNNING/0-of-1, one of them 8h old (the same stall
          # docs/INGESTION_REFERENCE.md item 2 documents), both still
          # consuming a task slot. Real observed throughput is ~38 projects/
          # min, so tier-1 capture has no legitimate reason to exceed 2h;
          # anything past that IS the hang, and should fail loudly while
          # there is still a human awake to read it.
          deploy_job specindex-pull-portals   2h  scripts/run-capture-and-load.py --tier 1 --batch-size 10
          deploy_job specindex-pull-socrata   1h  scripts/pull-socrata-permits.py config/socrata/austin.yaml config/socrata/seattle.yaml
          deploy_job specindex-pull-arcgis    1h  scripts/pull-arcgis-permits.py config/arcgis/denver.yaml config/arcgis/raleigh.yaml
          # --owner project, not reference. The PROJECT-document backlog is the
          # one with product value: project_csi_divisions is what the record
          # page's CSI scope matrix reads from, and 2,130 project documents had
          # text but no divisions as of 2026-08-08 while this job was pointed
          # at reference documents instead. Reference classification still
          # matters (jurisdiction-wide standards) but has no user-facing
          # surface yet -- give it its own job when it does, rather than
          # alternating one job between two backlogs.
          #
          # --limit 300 against a 6h timeout: measured throughput is ~1
          # minute/document (multi-chunk Flash calls over 500-1,800 page spec
          # books), so 300 finishes in ~5h with margin. The script selects
          # "has text, has no divisions yet", so consecutive executions
          # advance through the backlog on their own -- no cursor to keep and
          # no risk of double-classifying.
          deploy_job specindex-classify       6h  scripts/classify-spec-documents.py --owner project --limit 300

      - name: Verify the jobs exist
        run: |
          # Assert the NEXT step can see the output -- a deploy that reports
          # success and leaves no job is the shape this repo keeps hitting.
          gcloud run jobs list --region "$REGION" --project "$PROJECT" \
            --format='value(name)' | tee /tmp/jobs
          for j in specindex-pull-portals specindex-pull-socrata specindex-pull-arcgis specindex-classify; do
            grep -qx "$j" /tmp/jobs || { echo "::error::job $j missing after deploy"; exit 1; }
          done
