services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: specindex
      POSTGRES_PASSWORD: specindex
      POSTGRES_DB: specindex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specindex"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://specindex:specindex@db:5432/specindex
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
